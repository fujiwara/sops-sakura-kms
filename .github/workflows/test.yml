name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        go:
          - "1.26"
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Install sops
        env:
          SOPS_VERSION: v3.13.3
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/getsops/sops/releases/download/${SOPS_VERSION}"
          FILENAME="sops-${SOPS_VERSION}.linux.amd64"
          cd "$(mktemp -d)"
          curl -sSL --retry 3 -o "${FILENAME}" "${BASE_URL}/${FILENAME}"
          curl -sSL --retry 3 -o checksums.txt "${BASE_URL}/sops-${SOPS_VERSION}.checksums.txt"
          grep " ${FILENAME}$" checksums.txt | sha256sum -c -
          sudo install "${FILENAME}" /usr/local/bin/sops
          sops --version

      - name: Build & Test
        run: |
          go test -race ./...

      - name: Build image
        run: |
          make image-load
        env:
          IMAGE_VERSION: test-${{ github.sha }}-${{ matrix.go }}
